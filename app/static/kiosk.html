<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Kiosk</title>
<style>
:root{--stage:#0d141c;--panel:#16202b;--line:#25323f;--ink:#eef2f6;--muted:#8fa0b2;--ok:#34c58a;--late:#f0a03c;--bad:#ef6a5e;--primary:#6c8cff;
 --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--font);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;border-bottom:1px solid var(--line)}
header .co{font-size:20px;font-weight:650}
header .clock{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.02em}
header .date{color:var(--muted);font-size:14px;text-align:right}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:24px;padding:24px 28px;min-height:0}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.cam .frame{--ar:1.3333;position:relative;width:min(100cqw,calc(100cqh * var(--ar)));aspect-ratio:var(--ar)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.box{position:absolute;border:3px solid var(--primary);border-radius:10px;transition:all .15s linear}
.box.marked,.box.already{border-color:var(--ok)}
.box.late{border-color:var(--late)}
.box.unknown{border-color:var(--bad)}
.box.far,.box.poor{border-color:#6b7a89;border-style:dashed}
.box span{position:absolute;left:-3px;top:-30px;background:inherit;background:var(--primary);color:#06101c;font-weight:650;font-size:14px;padding:3px 10px;border-radius:6px;white-space:nowrap}
.box.marked span,.box.already span{background:var(--ok)}
.box.late span{background:var(--late)}
.box.unknown span{background:var(--bad)}
.box.far span,.box.poor span{background:#6b7a89;color:#fff}
.cam .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;color:var(--muted);background:#000c}
.side{display:flex;flex-direction:column;gap:20px;min-height:0}
.result{background:var(--panel);border-radius:14px;padding:26px 28px;border-left:10px solid var(--line);min-height:210px;display:flex;flex-direction:column;justify-content:center;transition:border-color .2s}
.result.ok{border-left-color:var(--ok)} .result.late{border-left-color:var(--late)} .result.bad{border-left-color:var(--bad)}
.result .big{font-size:34px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
.result .sub{color:var(--muted);margin-top:6px;font-size:16px}
.result .status{margin-top:16px;font-size:22px;font-weight:650}
.result.ok .status{color:var(--ok)} .result.late .status{color:var(--late)} .result.bad .status{color:var(--bad)}
.counts{display:flex;gap:28px;color:var(--muted);font-size:14px}
.counts b{display:block;color:var(--ink);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.recent{background:var(--panel);border-radius:14px;padding:6px 20px;overflow:auto;min-height:0;flex:1}
.recent .it{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.recent .it:last-child{border-bottom:0}
.recent .t{color:var(--muted);font-variant-numeric:tabular-nums}
.recent .none{color:var(--muted);padding:18px 0}
.tag{font-size:12.5px;font-weight:650;margin-left:8px}
.tag.on_time{color:var(--ok)} .tag.late{color:var(--late)} .tag.out{color:var(--muted)}
@media (max-width:860px){main{grid-template-columns:1fr;overflow:auto}body{overflow:auto}.cam{aspect-ratio:4/3;height:auto}}
</style></head><body>
<header>
  <div class="co" id="co">Attendance</div>
  <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
</header>
<main>
  <section class="cam">
    <div class="frame" id="frame"><video id="v" autoplay playsinline muted></video><div id="boxes"></div></div>
    <div class="msg" id="camMsg"></div>
  </section>
  <section class="side">
    <div class="result" id="result"><div class="big">Look at the camera</div><div class="sub">Your attendance is marked automatically.</div></div>
    <div class="counts"><div><b id="cPresent">0</b>in today</div><div><b id="cLate">0</b>late</div><div><b id="cTotal">0</b>enrolled</div></div>
    <div class="recent" id="recent"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const v=$('v'), boxes=$('boxes'), cv=document.createElement('canvas');
let busy=false, holdUntil=0, lastMark='';
const SEND_MS=450;

function tick(){const d=new Date();
  $('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
  $('date').textContent=d.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long',year:'numeric'});}
setInterval(tick,1000);tick();

function beep(freq,dur,times=1){try{const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());
  for(let i=0;i<times;i++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.connect(g);g.connect(a.destination);
  const t=a.currentTime+i*0.2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02);}}catch(e){}}

async function loadInfo(){
  try{const r=await (await fetch('/api/kiosk/info')).json();
  $('co').textContent=r.company;document.title=r.company+' - Attendance';
  $('cPresent').textContent=r.present;$('cLate').textContent=r.late;$('cTotal').textContent=r.enrolled;
  $('recent').innerHTML=r.recent.length?r.recent.map(e=>`<div class="it"><span>${esc(e.name)}<span class="tag ${e.kind==='check_out'?'out':e.detail}">${e.kind==='check_out'?'Checked out':e.detail==='late'?'Late':'On time'}</span></span><span class="t">${e.ts.slice(11,16)}</span></div>`).join(''):'<div class="none">No check-ins yet today.</div>';
  }catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
setInterval(loadInfo,8000);loadInfo();

function setResult(cls,big,sub,status){
  const r=$('result');r.className='result '+cls;
  r.innerHTML=`<div class="big">${esc(big)}</div><div class="sub">${esc(sub)}</div>${status?`<div class="status">${esc(status)}</div>`:''}`;}
function idle(){setResult('','Look at the camera','Your attendance is marked automatically.','');}

function render(faces){
  boxes.innerHTML='';
  for(const f of faces){
    const [x1,y1,x2,y2]=f.box;
    const d=document.createElement('div');
    let cls=f.state;if(f.state==='marked'&&f.status==='late')cls='late';
    d.className='box '+cls;
    // video is mirrored with CSS, so mirror the x-coordinates here too
    d.style.left=(1-x2)*100+'%';d.style.top=y1*100+'%';d.style.width=(x2-x1)*100+'%';d.style.height=(y2-y1)*100+'%';
    const label=f.state==='unknown'?'Not recognised':f.state==='far'?'Come closer':f.state==='poor'?f.message:(f.name||'');
    if(label){const s=document.createElement('span');s.textContent=label;d.appendChild(s);}
    boxes.appendChild(d);
  }
  const now=Date.now();
  for(const f of faces){
    if(f.state==='marked'){
      const key=f.person_id+f.action+f.time;
      if(key!==lastMark){lastMark=key;holdUntil=now+4500;
        if(f.action==='check_out'){setResult('ok','Goodbye, '+f.name,f.department||'','Checked out at '+f.time);beep(520,.25);}
        else if(f.status==='late'){setResult('late','Welcome, '+f.name,f.department||'','Checked in at '+f.time+' - late');beep(380,.18,2);}
        else{setResult('ok','Welcome, '+f.name,f.department||'','Checked in at '+f.time+' - on time');beep(880,.18);}
        loadInfo();}
      return;}
    if(f.state==='already'&&now>holdUntil){holdUntil=now+2500;setResult('ok',f.name,f.department||'','Already marked at '+f.time);return;}
  }
  if(now>holdUntil){
    const u=faces.find(f=>f.state==='unknown'),far=faces.find(f=>f.state==='far'),poor=faces.find(f=>f.state==='poor');
    if(u)setResult('bad','Face not recognised','Ask your admin to enrol you.','');
    else if(poor)setResult('','Hold on',poor.message,'');
    else if(far)setResult('','Come a little closer','','');
    else if(faces.length&&faces.every(f=>f.state==='confirming'))setResult('','Hold still...',faces[0].name||'','');
    else if(!faces.length)idle();
  }
}

async function loop(){
  if(!busy&&v.videoWidth){
    busy=true;
    const w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);
    cv.width=w;cv.height=h;cv.getContext('2d').drawImage(v,0,0,w,h);
    try{
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8));
      const res=await fetch('/api/kiosk/frame',{method:'POST',body:blob});
      if(res.ok)render((await res.json()).faces);
    }catch(e){}
    busy=false;
  }
  setTimeout(loop,SEND_MS);
}

async function start(){
  const m=$('camMsg');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    m.style.display='flex';m.innerHTML='The browser blocks the camera on this address.<br>Open this page as <b>http://localhost:8000/kiosk</b> on the kiosk computer, or start the server with <b>--https</b>.';return;}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    v.srcObject=s;await v.play();
    const setAr=()=>{if(v.videoWidth)$('frame').style.setProperty('--ar',v.videoWidth/v.videoHeight)};
    v.addEventListener('loadedmetadata',setAr);setAr();
    loop();
  }catch(e){m.style.display='flex';m.textContent='Camera not available: '+(e.name==='NotAllowedError'?'permission was denied. Allow the camera for this site and reload.':e.message);}
}
start();
// first click unlocks sound on browsers that require a gesture
addEventListener('pointerdown',()=>{try{beep.a&&beep.a.resume()}catch(e){}},{once:true});
</script></body></html>
