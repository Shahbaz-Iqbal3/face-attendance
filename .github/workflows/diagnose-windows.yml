name: Diagnose Windows
on: workflow_dispatch
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean FaceAttendance.spec
      - name: Smoke test exe
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe "dist\FaceAttendance\FaceAttendance.exe" -Label exe
      - name: Smoke test exe (OpenCV backend forced)
        shell: pwsh
        env: { FA_BACKEND: opencv }
        run: ./ci/smoke.ps1 -Exe "dist\FaceAttendance\FaceAttendance.exe" -Label exe-cv -Port 8125
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: setup.bat
        shell: cmd
        run: setup.bat < nul
      - name: diagnose.py on Windows
        shell: pwsh
        run: |
          .venv\Scripts\python.exe tools\diagnose.py
          $m = (Get-Content logs\diagnose.txt -Raw) -replace "%","%25" -replace "`r","" -replace "`n","%0A"
          Write-Host "::notice title=DIAGNOSE::$m"
      - name: run.bat smoke test
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe "run.bat" -Label scripts -Py ".venv\Scripts\python.exe"
