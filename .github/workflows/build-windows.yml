name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean FaceAttendance.spec
      - name: Smoke test the portable exe
        shell: pwsh
        run: ./ci/smoke.ps1 -Exe "dist\FaceAttendance\FaceAttendance.exe" -Label portable
      - name: Zip the portable version
        shell: pwsh
        run: Compress-Archive -Path dist\FaceAttendance -DestinationPath FaceAttendance-portable.zip
      - name: Install Inno Setup and build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" installer\FaceAttendance.iss
          Get-ChildItem installer-out
      - name: Test the installer (install, start, stop, uninstall)
        shell: pwsh
        run: ./ci/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttendance-Setup
          path: installer-out/FaceAttendance-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttendance-portable
          path: FaceAttendance-portable.zip
