name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean FaceAttendance.spec
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\FaceAttendance\FaceAttendance.exe -ArgumentList "--port 8123","--no-browser" -PassThru
          Start-Sleep -Seconds 15
          (Invoke-WebRequest http://localhost:8123/api/status -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force
      - run: Compress-Archive -Path dist\FaceAttendance -DestinationPath FaceAttendance-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: FaceAttendance-windows
          path: FaceAttendance-windows.zip
